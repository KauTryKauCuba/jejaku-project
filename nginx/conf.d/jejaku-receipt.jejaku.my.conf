server {
    listen 80;
    server_name jejaku-receipt.jejaku.my;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jejaku-receipt.jejaku.my;

    ssl_certificate     /etc/letsencrypt/live/jejaku-receipt.jejaku.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jejaku-receipt.jejaku.my/privkey.pem;

    # nginx's own default (1m) is smaller than a scanned/imported receipt
    # photo can legitimately be — a base64 data URL inflates it further,
    # and Long Receipt's multi-tile requests inflate it more still —
    # without this, nginx rejects the request with a 413 before it ever
    # reaches receipt-extract's own 8MB-per-image check.
    client_max_body_size 12m;

    location / {
        proxy_pass http://jejaku-receipt:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
