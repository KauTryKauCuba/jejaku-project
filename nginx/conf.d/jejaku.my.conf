server {
    listen 80;
    server_name jejaku.my;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jejaku.my;

    ssl_certificate     /etc/letsencrypt/live/jejaku.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jejaku.my/privkey.pem;

    # nginx's own default (1m) is smaller than what a photo upload (e.g.
    # an avatar) can legitimately be — without this, nginx rejects the
    # request with a 413 before it ever reaches the app.
    client_max_body_size 12m;

    location / {
        proxy_pass http://jejaku:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
