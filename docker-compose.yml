services:
  jejaku:
    build:
      context: ./jejaku
      args:
        NEXT_PUBLIC_RECEIPT_URL: ${NEXT_PUBLIC_RECEIPT_URL}
        NEXT_PUBLIC_TREE_URL: ${NEXT_PUBLIC_TREE_URL}
    ports:
      - "4000:4000"
    environment:
      # This VPS has no working outbound IPv6 route (confirmed 2026-09-06 —
      # ping to a resolved IPv6 address gets 100% packet loss), but DNS
      # answers for external hosts like accounts.google.com sometimes come
      # back as AAAA (IPv6) records anyway. Without this, Node's fetch
      # occasionally tries to dial that unreachable IPv6 address and the
      # OAuth callback fails with EAI_AGAIN/fetch failed. Forces Node to
      # always prefer an A (IPv4) record when both are available.
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: postgres://${JEJAKU_DB_USER}:${JEJAKU_DB_PASSWORD}@jejaku-db:5432/${JEJAKU_DB_NAME}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL}
      NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
      AUTH_URL: ${NEXT_PUBLIC_JEJAKU_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
    # Bypass Docker's embedded DNS proxy (127.0.0.11), which fails outbound
    # lookups (EAI_AGAIN) from inside this container ~30% of the time —
    # confirmed against 1.1.1.1 direct queries from the host being 100%
    # reliable. Querying it directly fixes OAuth callback and outbound-
    # fetch DNS failures at the source, instead of only masking them via
    # fetchRetry.ts's application-level retry. Only 1.1.1.1, not also
    # 8.8.8.8 — a prior incident on this same VPS (2026-09-06, Docker
    # build stage) found 8.8.8.8 itself timing out over plain UDP:53 from
    # this host, so listing it as a fallback here would reintroduce a
    # resolver already known to be unreliable on this box.
    dns:
      - 1.1.1.1
    volumes:
      - jejaku-avatars:/app/public/uploads/avatars
    depends_on:
      jejaku-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  jejaku-receipt:
    build:
      context: ./jejaku-receipt
      args:
        NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
    ports:
      - "4001:4001"
    environment:
      # See the same setting on the jejaku service above — this VPS has no
      # working outbound IPv6 route, so Node must be forced to prefer IPv4
      # DNS answers or an occasional AAAA record (e.g. for DeepSeek's API)
      # causes a hang/timeout instead of a clean fetch.
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: postgres://${RECEIPT_DB_USER}:${RECEIPT_DB_PASSWORD}@jejaku-receipt-db:5432/${RECEIPT_DB_NAME}
      AUTH_URL: ${NEXT_PUBLIC_RECEIPT_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    # See the same setting on the jejaku service above — bypasses Docker's
    # flaky embedded DNS proxy for outbound calls (DeepSeek API included).
    # Only 1.1.1.1 — see that comment for why 8.8.8.8 is deliberately not
    # listed as a fallback on this VPS.
    dns:
      - 1.1.1.1
    volumes:
      - jejaku-receipt-uploads:/app/public/uploads
    depends_on:
      jejaku-receipt-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  jejaku-tree:
    build:
      context: ./jejaku-tree
      args:
        NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
    ports:
      - "4002:4002"
    environment:
      # See the same setting on the jejaku service above — this VPS has no
      # working outbound IPv6 route.
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: postgres://${TREE_DB_USER}:${TREE_DB_PASSWORD}@jejaku-tree-db:5432/${TREE_DB_NAME}
      AUTH_URL: ${NEXT_PUBLIC_TREE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
    # See the same setting on the jejaku service above — bypasses Docker's
    # flaky embedded DNS proxy. Only 1.1.1.1, not also 8.8.8.8 — see that
    # comment for why.
    dns:
      - 1.1.1.1
    depends_on:
      jejaku-tree-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  jejaku-migrate:
    build:
      context: ./jejaku
      target: builder
    environment:
      DATABASE_URL: postgres://${JEJAKU_DB_USER}:${JEJAKU_DB_PASSWORD}@jejaku-db:5432/${JEJAKU_DB_NAME}
    depends_on:
      jejaku-db:
        condition: service_healthy
    entrypoint: ["npx", "drizzle-kit", "migrate"]
    profiles: ["tools"]

  jejaku-receipt-migrate:
    build:
      context: ./jejaku-receipt
      target: builder
      args:
        NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
    environment:
      DATABASE_URL: postgres://${RECEIPT_DB_USER}:${RECEIPT_DB_PASSWORD}@jejaku-receipt-db:5432/${RECEIPT_DB_NAME}
    depends_on:
      jejaku-receipt-db:
        condition: service_healthy
    entrypoint: ["npx", "drizzle-kit", "migrate"]
    profiles: ["tools"]

  jejaku-tree-migrate:
    build:
      context: ./jejaku-tree
      target: builder
      args:
        NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
    environment:
      DATABASE_URL: postgres://${TREE_DB_USER}:${TREE_DB_PASSWORD}@jejaku-tree-db:5432/${TREE_DB_NAME}
    depends_on:
      jejaku-tree-db:
        condition: service_healthy
    entrypoint: ["npx", "drizzle-kit", "migrate"]
    profiles: ["tools"]

  jejaku-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${JEJAKU_DB_NAME}
      POSTGRES_USER: ${JEJAKU_DB_USER}
      POSTGRES_PASSWORD: ${JEJAKU_DB_PASSWORD}
    ports:
      - "6432:5432"
    volumes:
      - jejaku-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JEJAKU_DB_USER} -d ${JEJAKU_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jejaku-receipt-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RECEIPT_DB_NAME}
      POSTGRES_USER: ${RECEIPT_DB_USER}
      POSTGRES_PASSWORD: ${RECEIPT_DB_PASSWORD}
    ports:
      - "6433:5432"
    volumes:
      - jejaku-receipt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECEIPT_DB_USER} -d ${RECEIPT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jejaku-tree-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TREE_DB_NAME}
      POSTGRES_USER: ${TREE_DB_USER}
      POSTGRES_PASSWORD: ${TREE_DB_PASSWORD}
    ports:
      - "6434:5432"
    volumes:
      - jejaku-tree-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TREE_DB_USER} -d ${TREE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - jejaku
      - jejaku-receipt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"]

volumes:
  jejaku-db-data:
  jejaku-receipt-db-data:
  jejaku-receipt-uploads:
  jejaku-avatars:
  jejaku-tree-db-data:
