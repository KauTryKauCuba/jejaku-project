services:
  jejaku:
    build:
      context: ./jejaku
      args:
        NEXT_PUBLIC_RECEIPT_URL: ${NEXT_PUBLIC_RECEIPT_URL}
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://${JEJAKU_DB_USER}:${JEJAKU_DB_PASSWORD}@jejaku-db:5432/${JEJAKU_DB_NAME}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL}
      NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      jejaku-db:
        condition: service_healthy
    restart: unless-stopped

  jejaku-receipt:
    build:
      context: ./jejaku-receipt
      args:
        NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgres://${RECEIPT_DB_USER}:${RECEIPT_DB_PASSWORD}@jejaku-receipt-db:5432/${RECEIPT_DB_NAME}
    depends_on:
      jejaku-receipt-db:
        condition: service_healthy
    restart: unless-stopped

  jejaku-migrate:
    build:
      context: ./jejaku
      target: builder
    environment:
      DATABASE_URL: postgres://${JEJAKU_DB_USER}:${JEJAKU_DB_PASSWORD}@jejaku-db:5432/${JEJAKU_DB_NAME}
    depends_on:
      jejaku-db:
        condition: service_healthy
    entrypoint: ["npx", "drizzle-kit", "migrate"]
    profiles: ["tools"]

  jejaku-receipt-migrate:
    build:
      context: ./jejaku-receipt
      target: builder
      args:
        NEXT_PUBLIC_JEJAKU_URL: ${NEXT_PUBLIC_JEJAKU_URL}
    environment:
      DATABASE_URL: postgres://${RECEIPT_DB_USER}:${RECEIPT_DB_PASSWORD}@jejaku-receipt-db:5432/${RECEIPT_DB_NAME}
    depends_on:
      jejaku-receipt-db:
        condition: service_healthy
    entrypoint: ["npx", "drizzle-kit", "migrate"]
    profiles: ["tools"]

  jejaku-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${JEJAKU_DB_NAME}
      POSTGRES_USER: ${JEJAKU_DB_USER}
      POSTGRES_PASSWORD: ${JEJAKU_DB_PASSWORD}
    ports:
      - "6432:5432"
    volumes:
      - jejaku-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JEJAKU_DB_USER} -d ${JEJAKU_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jejaku-receipt-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RECEIPT_DB_NAME}
      POSTGRES_USER: ${RECEIPT_DB_USER}
      POSTGRES_PASSWORD: ${RECEIPT_DB_PASSWORD}
    ports:
      - "6433:5432"
    volumes:
      - jejaku-receipt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECEIPT_DB_USER} -d ${RECEIPT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - jejaku
      - jejaku-receipt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"]

volumes:
  jejaku-db-data:
  jejaku-receipt-db-data:
